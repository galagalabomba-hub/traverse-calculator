<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>閉合導線測量計算器 (自訂測站數量版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .print-card { border: 1px solid #ccc !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & Config -->
        <header class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl no-print">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                        <span></span> 閉合導線測量計算器
                    </h1>
                    <p class="text-xs text-slate-400 mt-1">
                        嚴格遵循中華民國技術士測量乙、丙級規章規範 | 支持自訂測站數 | Bowditch 羅盤法則平差
                    </p>
                </div>
                
                <!-- 測站數量控制區 -->
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 flex items-center gap-3">
                    <label for="stationCountInput" class="text-sm font-semibold text-slate-300 whitespace-nowrap">
                        測站數量 (n)：
                    </label>
                    <input type="number" id="stationCountInput" min="3" max="50" value="10" 
                           class="w-20 px-3 py-1.5 bg-slate-800 border border-slate-600 rounded text-center text-emerald-300 font-bold focus:outline-none focus:border-emerald-500">
                    <button onclick="updateStationCount()" 
                            class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium text-sm transition">
                        更新欄位
                    </button>
                </div>
            </div>
        </header>

        <!-- Base Parameters Input -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 no-print">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs font-semibold text-slate-400 mb-1">起點 X 座標 (Easting)</label>
                <input type="number" step="any" id="startX" value="1000.000" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs font-semibold text-slate-400 mb-1">起點 Y 座標 (Northing)</label>
                <input type="number" step="any" id="startY" value="1000.000" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs font-semibold text-slate-400 mb-1">起始方位角 (度° 分' 秒")</label>
                <div class="grid grid-cols-3 gap-1">
                    <input type="number" id="startAzDeg" value="45" placeholder="度" class="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-center text-slate-200 focus:outline-none focus:border-emerald-500">
                    <input type="number" id="startAzMin" value="0" placeholder="分" class="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-center text-slate-200 focus:outline-none focus:border-emerald-500">
                    <input type="number" id="startAzSec" value="0" placeholder="秒" class="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-center text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-end gap-2">
                <button onclick="loadDefaultData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded text-xs font-semibold transition">載入範例資料</button>
                <button onclick="calculateTraverse()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded text-xs font-semibold transition shadow-lg shadow-emerald-900/40">執行導線計算</button>
            </div>
        </div>

        <!-- Data Entry Table -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-xl no-print overflow-x-auto">
            <h2 class="text-md font-semibold text-slate-300 mb-3 flex items-center justify-between">
                <span> 觀測數據輸入 (內角與邊長)</span>
                <span id="theorySumBadge" class="text-xs font-normal text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2.5 py-1 rounded-full">
                    理論內角和：1440°00'00"
                </span>
            </h2>
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-900/60 text-slate-400 uppercase text-xs">
                    <tr>
                        <th class="p-2 border-b border-slate-700">站號</th>
                        <th class="p-2 border-b border-slate-700">測站名稱</th>
                        <th class="p-2 border-b border-slate-700 text-center" colspan="3">折角/內角 (度 - 分 - 秒)</th>
                        <th class="p-2 border-b border-slate-700">測線長 (S_i, 公尺)</th>
                    </tr>
                </thead>
                <tbody id="inputTableBody">
                    <!-- Dynamic Table Rows Will Be Generated Here -->
                </tbody>
            </table>
        </div>

        <!-- Compliance Evaluation Cards -->
        <div id="complianceSection" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            <div id="levelCCard" class="bg-slate-800 border p-4 rounded-xl shadow-md"></div>
            <div id="levelBCard" class="bg-slate-800 border p-4 rounded-xl shadow-md"></div>
        </div>

        <!-- Results Table -->
        <div id="resultSection" class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-xl hidden print-card">
            <div class="flex items-center justify-between mb-4 no-print">
                <h2 class="text-lg font-bold text-emerald-400"> 閉合導線計算平差表</h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-3 py-1.5 rounded border border-slate-600">匯出 CSV</button>
                    <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-3 py-1.5 rounded border border-slate-600">列印 / 存為 PDF</button>
                </div>
            </div>

            <!-- Summary Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-900/80 p-3 rounded-lg border border-slate-700/60 mb-4 text-xs">
                <div>角度閉合差 (Wα)：<span id="sumWAlpha" class="font-bold text-emerald-300"></span></div>
                <div>總測線長 (ΣS)：<span id="sumDistance" class="font-bold text-slate-200"></span> m</div>
                <div>座標閉合差 (fx / fy)：<span id="sumFxFy" class="font-bold text-slate-200"></span></div>
                <div>相對精度 (1:N)：<span id="relativePrecision" class="font-bold text-emerald-400"></span></div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center text-xs border-collapse">
                    <thead class="bg-slate-900 text-slate-400">
                        <tr class="border-b border-slate-700">
                            <th class="p-2 border-r border-slate-700">點號</th>
                            <th class="p-2 border-r border-slate-700">觀測角 (β)</th>
                            <th class="p-2 border-r border-slate-700">改正角 (β')</th>
                            <th class="p-2 border-r border-slate-700">方位角 (Az)</th>
                            <th class="p-2 border-r border-slate-700">邊長 S(m)</th>
                            <th class="p-2 border-r border-slate-700">計算 ΔX</th>
                            <th class="p-2 border-r border-slate-700">計算 ΔY</th>
                            <th class="p-2 border-r border-slate-700">Vx</th>
                            <th class="p-2 border-r border-slate-700">Vy</th>
                            <th class="p-2 border-r border-slate-700">平差 ΔX</th>
                            <th class="p-2 border-r border-slate-700">平差 ΔY</th>
                            <th class="p-2 border-r border-slate-700">X 座標 (E)</th>
                            <th class="p-2">Y 座標 (N)</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="divide-y divide-slate-700/50 text-slate-200"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 預設 10 站數據資料範例
        const default10Data = [
            { name: "A", d: 143, m: 59, s: 50, dist: 120.500 },
            { name: "B", d: 144, m: 0,  s: 10, dist: 135.200 },
            { name: "C", d: 143, m: 59, s: 40, dist: 110.800 },
            { name: "D", d: 144, m: 0,  s: 20, dist: 145.600 },
            { name: "E", d: 143, m: 59, s: 30, dist: 130.400 },
            { name: "F", d: 144, m: 0,  s: 0,  dist: 125.100 },
            { name: "G", d: 143, m: 59, s: 50, dist: 118.900 },
            { name: "H", d: 144, m: 0,  s: 10, dist: 140.300 },
            { name: "I", d: 143, m: 59, s: 40, dist: 128.700 },
            { name: "J", d: 144, m: 0,  s: 10, dist: 132.000 }
        ];

        // 初始化頁面
        window.onload = () => {
            renderInputTable(10);
            loadDefaultData();
        };

        // 更新測站數量
        function updateStationCount() {
            const count = parseInt(document.getElementById('stationCountInput').value) || 10;
            if (count < 3) {
                alert("測站數量至少需為 3 站 (閉合多邊形)！");
                return;
            }
            renderInputTable(count);
        }

        // 動態生成輸入表格欄位
        function renderInputTable(count) {
            const tbody = document.getElementById('inputTableBody');
            tbody.innerHTML = '';

            const theoreticalSum = (count - 2) * 180;
            document.getElementById('theorySumBadge').innerText = `理論內角和：${theoreticalSum}°00'00"`;

            for (let i = 0; i < count; i++) {
                const charCodeName = String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition";
                tr.innerHTML = `
                    <td class="p-2 font-mono text-emerald-400 font-bold">${i + 1}</td>
                    <td class="p-2"><input type="text" id="st_${i}" value="測站 ${charCodeName}" class="w-24 bg-slate-900 border border-slate-700 rounded px-2 py-1"></td>
                    <td class="p-1"><input type="number" id="deg_${i}" placeholder="度" class="w-16 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-center"></td>
                    <td class="p-1"><input type="number" id="min_${i}" placeholder="分" class="w-16 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-center"></td>
                    <td class="p-1"><input type="number" id="sec_${i}" placeholder="秒" class="w-16 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-center"></td>
                    <td class="p-2"><input type="number" step="any" id="dist_${i}" placeholder="長度" class="w-32 bg-slate-900 border border-slate-700 rounded px-2 py-1"></td>
                `;
                tbody.appendChild(tr);
            }
        }

        // 載入預設範例資料
        function loadDefaultData() {
            document.getElementById('stationCountInput').value = 10;
            renderInputTable(10);
            
            for (let i = 0; i < 10; i++) {
                const d = default10Data[i];
                document.getElementById(`st_${i}`).value = d.name;
                document.getElementById(`deg_${i}`).value = d.d;
                document.getElementById(`min_${i}`).value = d.m;
                document.getElementById(`sec_${i}`).value = d.s;
                document.getElementById(`dist_${i}`).value = d.dist;
            }
        }

        // 角度轉秒數
        function dmsToSec(d, m, s) {
            return (parseFloat(d) || 0) * 3600 + (parseFloat(m) || 0) * 60 + (parseFloat(s) || 0);
        }

        // 秒數格式化為 DMS 字串
        function secToDMSStr(totalSec) {
            const sign = totalSec < 0 ? "-" : "";
            let absSec = Math.abs(Math.round(totalSec));
            const d = Math.floor(absSec / 3600);
            absSec %= 3600;
            const m = Math.floor(absSec / 60);
            const s = absSec % 60;
            return `${sign}${d}°${String(m).padStart(2, '0')}'${String(s).padStart(2, '0')}"`;
        }

        // 主要導線計算核心
        function calculateTraverse() {
            const count = parseInt(document.getElementById('stationCountInput').value) || 10;
            const startX = parseFloat(document.getElementById('startX').value) || 0;
            const startY = parseFloat(document.getElementById('startY').value) || 0;

            const azD = parseFloat(document.getElementById('startAzDeg').value) || 0;
            const azM = parseFloat(document.getElementById('startAzMin').value) || 0;
            const azS = parseFloat(document.getElementById('startAzSec').value) || 0;
            let currentAzSec = azD * 3600 + azM * 60 + azS;

            let obsAngles = [];
            let distances = [];
            let names = [];
            let totalObsSec = 0;
            let totalDist = 0;

            // 讀取數據
            for (let i = 0; i < count; i++) {
                names.push(document.getElementById(`st_${i}`).value || `${i+1}`);
                const sec = dmsToSec(
                    document.getElementById(`deg_${i}`).value,
                    document.getElementById(`min_${i}`).value,
                    document.getElementById(`sec_${i}`).value
                );
                const dist = parseFloat(document.getElementById(`dist_${i}`).value) || 0;

                obsAngles.push(sec);
                distances.push(dist);
                totalObsSec += sec;
                totalDist += dist;
            }

            // 1. 角度閉合差計算 (順時針閉合多邊形理論內角和 = (n-2)*180°)
            const theorySec = (count - 2) * 180 * 3600;
            const wAlphaSec = totalObsSec - theorySec; // 閉合差

            // 角度平差 (Bowditch 秒數整合分配)
            const corrTotalSec = -wAlphaSec;
            const baseCorrPerAngle = Math.trunc(corrTotalSec / count);
            let remainderSec = corrTotalSec % count;

            let adjAnglesSec = [];
            for (let i = 0; i < count; i++) {
                let corr = baseCorrPerAngle;
                if (remainderSec !== 0) {
                    corr += (remainderSec > 0) ? 1 : -1;
                    remainderSec += (remainderSec > 0) ? -1 : 1;
                }
                adjAnglesSec.push(obsAngles[i] + corr);
            }

            // 2. 各邊方位角、坐標增量計算
            let azimuths = [];
            let dxList = [], dyList = [];
            let sumDx = 0, sumDy = 0;

            for (let i = 0; i < count; i++) {
                // 順時針導線公式: Az_next = Az_prev + 180° - β_i (mod 360°)
                currentAzSec = (currentAzSec + 180 * 3600 - adjAnglesSec[i]) % (360 * 3600);
                if (currentAzSec < 0) currentAzSec += 360 * 3600;
                azimuths.push(currentAzSec);

                const azRad = (currentAzSec / 3600) * (Math.PI / 180);
                const dx = distances[i] * Math.sin(azRad);
                const dy = distances[i] * Math.cos(azRad);

                dxList.push(dx);
                dyList.push(dy);
                sumDx += dx;
                sumDy += dy;
            }

            // 座標閉合差
            const fx = sumDx;
            const fy = sumDy;
            const fs = Math.sqrt(fx * fx + fy * fy);
            const precisionN = Math.floor(totalDist / fs);

            // 3. 羅盤法則 (Bowditch Rule) 配賦 V_x, V_y
            let vxList = [], vyList = [];
            let adjDxList = [], adjDyList = [];
            let coords = [{ x: startX, y: startY }];

            let currX = startX;
            let currY = startY;

            for (let i = 0; i < count; i++) {
                const vx = -fx * (distances[i] / totalDist);
                const vy = -fy * (distances[i] / totalDist);

                vxList.push(vx);
                vyList.push(vy);

                const adjDx = dxList[i] + vx;
                const adjDy = dyList[i] + vy;

                adjDxList.push(adjDx);
                adjDyList.push(adjDy);

                currX += adjDx;
                currY += adjDy;
                coords.push({ x: currX, y: currY });
            }

            // 4. 渲染結果 UI
            document.getElementById('sumWAlpha').innerText = secToDMSStr(wAlphaSec);
            document.getElementById('sumDistance').innerText = totalDist.toFixed(3);
            document.getElementById('sumFxFy').innerText = `fx: ${fx.toFixed(4)}m / fy: ${fy.toFixed(4)}m (fs: ${fs.toFixed(4)}m)`;
            document.getElementById('relativePrecision').innerText = `1 : ${precisionN.toLocaleString()}`;

            // 5. 檢核乙、丙級測量規範
            evaluateCompliance(count, wAlphaSec, precisionN);

            // 6. 渲染平差結果表格
            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/30 transition";
                tr.innerHTML = `
                    <td class="p-2 font-mono text-emerald-400 font-bold border-r border-slate-700">${names[i]}</td>
                    <td class="p-2 border-r border-slate-700">${secToDMSStr(obsAngles[i])}</td>
                    <td class="p-2 border-r border-slate-700 font-semibold text-emerald-300">${secToDMSStr(adjAnglesSec[i])}</td>
                    <td class="p-2 border-r border-slate-700">${secToDMSStr(azimuths[i])}</td>
                    <td class="p-2 border-r border-slate-700">${distances[i].toFixed(3)}</td>
                    <td class="p-2 border-r border-slate-700">${dxList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700">${dyList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700 text-slate-400">${vxList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700 text-slate-400">${vyList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700 text-emerald-300">${adjDxList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700 text-emerald-300">${adjDyList[i].toFixed(4)}</td>
                    <td class="p-2 border-r border-slate-700 font-mono font-bold">${coords[i+1].x.toFixed(3)}</td>
                    <td class="p-2 font-mono font-bold">${coords[i+1].y.toFixed(3)}</td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById('complianceSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
        }

        // 中華民國技術士規範評估
        function evaluateCompliance(n, wAlphaSec, precisionN) {
            // 丙級規範：W_α <= 30"√n，導線相對精度 >= 1/3,000
            const maxWAlphaC = Math.round(30 * Math.sqrt(n));
            const isPassC_Angle = Math.abs(wAlphaSec) <= maxWAlphaC;
            const isPassC_Prec = precisionN >= 3000;

            const cardC = document.getElementById('levelCCard');
            cardC.className = `p-4 rounded-xl border ${isPassC_Angle && isPassC_Prec ? 'bg-emerald-950/40 border-emerald-600' : 'bg-rose-950/40 border-rose-600'}`;
            cardC.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-slate-200">測量丙級技術士規範檢核</h3>
                    <span class="px-2 py-0.5 rounded text-xs font-bold ${isPassC_Angle && isPassC_Prec ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}">
                        ${isPassC_Angle && isPassC_Prec ? '合格 PASS' : '不合格 FAIL'}
                    </span>
                </div>
                <div class="text-xs space-y-1 text-slate-300">
                    <div>角度容許誤差 : ±${maxWAlphaC}" (實際: ${wAlphaSec}) ${isPassC_Angle ? '✓' : '✗'}</div>
                    <div>相對精度要求: 1/3,000 (實際: 1/${precisionN.toLocaleString()}) ${isPassC_Prec ? '✓' : '✗'}</div>
                </div>
            `;

            // 乙級規範：W_α <= 15"√n，導線相對精度 >= 1/10,000
            const maxWAlphaB = Math.round(15 * Math.sqrt(n));
            const isPassB_Angle = Math.abs(wAlphaSec) <= maxWAlphaB;
            const isPassB_Prec = precisionN >= 10000;

            const cardB = document.getElementById('levelBCard');
            cardB.className = `p-4 rounded-xl border ${isPassB_Angle && isPassB_Prec ? 'bg-emerald-950/40 border-emerald-600' : 'bg-rose-950/40 border-rose-600'}`;
            cardB.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-slate-200">測量乙級技術士規範檢核</h3>
                    <span class="px-2 py-0.5 rounded text-xs font-bold ${isPassB_Angle && isPassB_Prec ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}">
                        ${isPassB_Angle && isPassB_Prec ? '合格 PASS' : '不合格 FAIL'}
                    </span>
                </div>
                <div class="text-xs space-y-1 text-slate-300">
                    <div>角度容許誤差 : ±${maxWAlphaB}" (實際: ${wAlphaSec}") ${isPassB_Angle ? '✓' : '✗'}</div>
                    <div>相對精度要求: 1/10,000 (實際: 1/${precisionN.toLocaleString()}) ${isPassB_Prec ? '✓' : '✗'}</div>
                </div>
            `;
        }

        // CSV 匯出功能
        function exportCSV() {
            let csv = "\uFEFF點號,觀測角,改正角,方位角,邊長(m),計算dx,計算dy,Vx,Vy,平差dx,平差dy,X座標,Y座標\n";
            const rows = document.querySelectorAll('#resultTableBody tr');
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                const rowData = Array.from(cols).map(c => `"${c.innerText.trim()}"`);
                csv += rowData.join(",") + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "閉合導線計算平差表.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
